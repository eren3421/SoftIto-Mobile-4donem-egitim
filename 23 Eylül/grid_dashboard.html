<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFTITO EVE CSMS PORTAL</title>
    <style>
        *,*::before,::after{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            font-family: 'Courier New', Courier, monospace;
            background: black;
            color: rgb(255, 255, 255);
        }
        .portal-shell{
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 60px 1fr 40px;
            grid-template-areas: "nav header" "nav main" 
            "nav footer";
            height:100vh;
            gap: 12px;
            padding: 12px;

        }
        .panel{
            background: black;
            border: 1px solid gray;
            border-radius: 12px;
            padding: 16px 20px;
        }
        header{
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #18181b;
        }
        nav{
            grid-area: nav;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: black;
        }
        main{
            grid-area: main;
            background: #141416;
            overflow-y: auto;
        }
        footer{
            grid-area: footer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #71717a;
        }
        .menu-item{
            padding: 9px 12px;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            color: #a1a1aa;
            transition: all 0.15s ease;
        }
        .menu-item:hover{
            background: #27272a;
            color: #f4f4;
        }
        .menu-item.active{
            background: #27272a;
            font-weight: 600;
            color: #fafa;
            border: 1px solid #f3f3;
        }
    </style>
</head>
<body>
    <div class="portal-shell">
        <header class="panel">
            <strong>Softito Panel</strong>
            <span style="font-size: 13px;color:yellow;">Oturum: Eren Türkmen</span>
        </header>
        <nav class="panel">
            <div style="font-size: 11px;font-weight:700;color:antiquewhite
            ;letter-spacing: 0.8px;">Navigasyon</div>
            <div class="menu-item active">Dashboard</div>
            <div class="menu-item">İstasyonlar & Soketler</div>
            <div class="menu-item">EPOK BİLDİRİMLERİ</div>
            <div class="menu-item">Fatura ve Gelirler</div>
        </nav>
        <main class="panel">
            <h2 style="font-size: 20px;font-weight: 700; letter-spacing: -0.5px;"></h2>
            <p style="color: aliceblue;margin-top: 8px; line-height: 1.6;">
                grid-template-areas sayesinde html sırasından bağımsız çalışır
            </p>

        </main>
        <footer class="panel">
            SoftIto 4. Dönem Mobil Eğitim
        </footer>
    </div>
</body>
</html>
