<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID METRİK PANELİ</title>
    <style>
        *,*::before,*::after{
            box-sizing: border-box; 
            margin:0;
            padding: 0;
        }
        :root{
            --bg:black;
            --card-bg:gray;
            --border:white;
            --text:white;
            --text-muted:whitesmoke;
            --accent:orange;
            --success: green;
        }
        body{
            font-family: fantasy;
            background: var(--bg);
            color:var(--text);
            padding: 30px;
        }
        h1{
            margin-top: 24px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            letter-spacing: -0.5px;
        }
        .metric-grid{
            /*tek satırda responsive ve ekran ne kadar büyükse o kadara sığdır*/
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap:18px;
            max-width: 1100px;
            margin:0 auto;
        }
        .metric-card{
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            transition: all 0.2 ease;
        }
        .metric-card:hover{
            transform: translateY(-4px);
            border-color: grey;
            box-shadow: 0 12px 24px -8px rgba(0,0,0,0.5);
        }
        .card-label{
            font-size: 12px;
            font-weight: 600;
            color:var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .car-num{
            font-size: 32px;
            font-weight: 800;
            color:var(--text);
            margin: 8px 0;
            letter-spacing: -1px;
        }
        .card-growth{
            font-size: 13px;
            font-weight: 600;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>
    <h1>css metrikleri(auto-fit+minmax)</h1>
    <div class="metric-grid">
        <div class="metric-card">
            <span class="card-label">Anlık Şarj İstasyonu</span>
            <div class="card-num">125 Soket</div>
                  <span class="card-growth">%92.4 Aktif</span>
        </div>
        <div class="metric-card">
            <span class="card-label">Bugünkü Tüketim</span>
            <div class="card-num">4.850Kwh</div>
                  <span class="card-growth">+%12 dünden fazla</span>
        </div>
        <div class="metric-card">
            <span class="card-label">GİB Eşu Bildirimi</span>
            <div class="card-num" style="color: var(--accent);">Hatırlatma: 0 Hata</div>
                  <span class="card-growth">Şuanda Xades ve Ves Onaylı</span>
        </div>
        <div class="metric-card">
            <span class="card-label">Ortalama Süre</span>
            <div class="card-num">36.5 Dk</div>
                  <span class="card-growth">120Kw Dc Hızlı Şarj</span>
        </div>
    </div>
</body>
</html>
