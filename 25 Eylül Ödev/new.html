<!-- HTML5 belge tipini tanımlar -->
<!doctype html> 
<!-- İngilizce dilinde yazılmış HTML belgesinin başlangıcı -->
<html lang="en"> 
  <head>
    <!-- Karakter kodlamasını UTF-8 (Türkçe ve tüm özel karakterleri destekleyen standart) olarak ayarlar -->
    <meta charset="UTF-8" /> 
    <!-- Mobil cihazlarda sayfanın ekrana düzgün ölçeklenmesini sağlar (Responsive tasarım) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <!-- Tarayıcı sekmesinde görünecek sayfa başlığı -->
    <title>Sipariş & Gelir Kokpit Dashboard</title>
    
    <!-- CSS stil kodlarının başladığı etiket -->
    <style> 
      /* CSS Global Değişkenleri (:root) - Renk ve yazı tipi paleti tanımlanıyor */
      :root { 
        --bg: #f8f7f4; /* Arka plan ana rengi */
        --card: #ffffff; /* Kartların arka plan rengi (Beyaz) */
        --border: #e6e5df; /* Çerçeve ve ayırıcı çizgi rengi */
        --text: #181716; /* Ana metin rengi */
        --muted: #6b6963; /* İkincil / soluk metin rengi */
        --clay: #c85a32; /* Vurgu / buton rengi (Kiremit tonu) */
        --clay-hover: #b04e29; /* Butonun üzerine gelindiğinde (hover) alacağı renk */
        --font-main: "Plus Jakarta Sans", system-ui, sans-serif; /* Ana yazı tipi ailesi */
        --font-mono: "JetBrains Mono", monospace; /* Sayısal değerler için monospaced yazı tipi */
      }

      /* Tüm elemanlar için genel CSS sıfırlaması (Reset) */
      *{ 
        box-sizing: border-box; /* Padding ve border değerlerini toplam genişliğe dahil eder */
        margin: 0; /* Varsayılan dış boşlukları sıfırlar */
        padding: 0; /* Varsayılan iç boşlukları sıfırlar */
      }

      /* Sayfa gövdesi (body) stilleri */
      body { 
        background: var(--bg); /* Arka plan rengini :root değişkeninden alır */
        color: var(--text); /* Yazı rengini :root değişkeninden alır */
        font-family: var(--font-main); /* Varsayılan yazı tipini uygular */
        padding: 36px 16px; /* Üst-alt 36px, sağ-sol 16px iç boşluk bırakır */
        line-height: 1.5; /* Metin satır yüksekliğini fontun 1.5 katı yapar */
      }

      /* Ana kapsayıcı (Container) */
      .kokpit { 
        max-width: 960px; /* Maksimum genişliği 960 piksel ile sınırlar */
        margin: 0 auto; /* Sayfayı yatayda tam ortalar */
      }

      /* Üst Bilgi (Header) Stilleri */
      .header { 
        margin-bottom: 24px; /* Altına 24px dış boşluk ekler */
        padding-bottom: 16px; /* Altına 16px iç boşluk ekler */
        border-bottom: 1px solid var(--border); /* Altına ince ayırıcı çizgi çeker */
      }

      .header__tag {
        font-size: 11px; /* Küçük etiket yazı boyutu */
        text-transform: uppercase; /* Tüm harfleri büyük yapar */
        letter-spacing: 0.12em; /* Harfler arası genişlik ekler */
        color: var(--clay); /* Etiket rengini kiremit tonu yapar */
        font-weight: 700; /* Kalın yazı tipi */
      }

      .header__title {
        font-size: 26px; /* Başlık yazı boyutu */
        font-weight: 700; /* Kalın yazı tipi */
        margin-top: 2px; /* Üstten hafif 2px boşluk */
      }

      /* KPI Kartları Izgarası (Grid Layout) */
      .kpi-grid {
        display: grid; /* Izgara düzeni modunu aktif eder */
        grid-template-columns: repeat(3, 1fr); /* Yan yana 3 eşit genişlikte sütun oluşturur */
        gap: 14px; /* Kartlar arasına 14px boşluk koyar */
        margin-bottom: 24px; /* Alt panellerle arasına 24px boşluk koyar */
      }

      /* KPI Kartının Tekil Tasarımı */
      .kpi-card {
        background: var(--card); /* Kart arka planı (Beyaz) */
        border: 1px solid var(--border); /* Çerçeve çizgisi */
        border-radius: 8px; /* Köşeleri 8px yuvarlatır */
        padding: 14px 18px; /* Kart içi boşluklar */
      }

      .kpi-card span {
        font-size: 12px; /* Başlık etiketi boyutu */
        color: var(--muted); /* Soluk gri yazı rengi */
        font-weight: 600; /* Yarı kalın yazı */
      }

      .kpi-card h3 {
        font-size: 22px; /* Sayısal değerlerin yazı boyutu */
        font-weight: 700; /* Kalın yazı */
        font-family: var(--font-mono); /* Sayılar için sabit genişlikli yazı tipi */
        margin-top: 4px; /* Üst başlık ile arasına 4px boşluk */
      }

      /* Ana Sayfa Düzeni (Layout) */
      .layout {
        display: grid; /* Izgara düzeni */
        grid-template-columns: 320px 1fr; /* Sol sütun 320px sabit, sağ sütun kalan tüm alanı kaplar */
        gap: 24px; /* Sütunlar arası 24px boşluk */
      }

      /* Mobil Cihazlar İçin Medya Sorgusu (Responsive) */
      @media (max-width: 768px) {
        .layout,
        .kpi-grid {
          grid-template-columns: 1fr; /* Ekran 768px altında kaldığında sütunları tek sütuna düşürür */
        }
      }

      /* Form ve Panel Kartı Stilleri */
      .panel {
        background: var(--card); /* Beyaz arka plan */
        border: 1px solid var(--border); /* İnce çerçeve */
        border-radius: 10px; /* 10px köşe yuvarlatma */
        padding: 20px; /* Panel içi 20px boşluk */
      }

      .panel h4 {
        font-size: 15px; /* Panel alt başlık boyutu */
        font-weight: 700; /* Kalın yazı */
        margin-bottom: 14px; /* Altındaki öğelerle boşluk */
        padding-bottom: 8px; /* Alt çizgiyle aradaki iç boşluk */
        border-bottom: 1px solid var(--border); /* Panel başlığının alt çizgisi */
      }

      /* Form Alanları (Field) */
      .field {
        margin-bottom: 12px; /* Her bir form elemanının altına 12px boşluk koyar */
      }

      .field label {
        display: block; /* Etiketi blok eleman yapar, input üstüne geçer */
        font-size: 12px; /* Etiket metin boyutu */
        font-weight: 600; /* Yarı kalın yazı */
        margin-bottom: 4px; /* Input ile arasına 4px boşluk */
      }

      .field input,
      .field select {
        width: 100%; /* İnput ve seçim kutusunu %100 genişlikte yapar */
        padding: 8px 10px; /* İç boşluk */
        font-size: 13px; /* Yazı boyutu */
        font-family: inherit; /* Ana yazı tipini miras alır */
        background: var(--bg); /* Hafif krem arka plan */
        border: 1px solid var(--border); /* İnce çerçeve */
        border-radius: 6px; /* Köşe yuvarlatma */
      }

      .field input:focus,
      .field select:focus {
        outline: none; /* Odaklanıldığında mavi varsayılan dış çizgiyi kaldırır */
        border-color: var(--clay); /* Odaklanınca çerçeveyi kiremit rengi yapar */
        background: #fff; /* Odaklanınca arka planı tam beyaz yapar */
      }

      /* Kaydet Butonu */
      .btn-submit {
        width: 100%; /* Tam genişlik kaplar */
        background: var(--clay); /* Kiremit rengi arka plan */
        color: #fff; /* Beyaz yazı rengi */
        border: none; /* Çerçeveyi kaldırır */
        padding: 10px; /* Buton içi boşluk */
        font-size: 13px; /* Metin boyutu */
        font-weight: 600; /* Yarı kalın metin */
        border-radius: 6px; /* Köşe yuvarlatma */
        cursor: pointer; /* Üzerine gelince el simgesi çıkartır */
        margin-top: 6px; /* Üstten 6px boşluk */
      }

      .btn-submit:hover {
        background: var(--clay-hover); /* Butonun üzerine gelindiğinde koyu kiremit rengine geçer */
      }

      /* Liste ve Filtreleme Çubuğu */
      .filter-bar {
        display: flex; /* Esnek kutu düzeni (Yan yana dizilim) */
        gap: 10px; /* Elemanlar arası 10px boşluk */
        margin-bottom: 14px; /* Alt liste ile araya 14px boşluk */
      }

      .order-list {
        display: flex; /* Esnek kutu */
        flex-direction: column; /* Öğeleri alt alta sıralar */
        gap: 10px; /* Liste elemanları arasına 10px boşluk koyar */
      }

      .order-item {
        background: var(--bg); /* Krem tonunda arka plan */
        border: 1px solid var(--border); /* Çerçeve */
        border-radius: 6px; /* Köşe yuvarlama */
        padding: 12px 14px; /* İç boşluk */
        display: flex; /* Yan yana eleman dizilimi */
        justify-content: space-between; /* İki uca yaslar (Sol: detay, Sağ: etiket ve sil butonu) */
        align-items: center; /* Dikeyde ortalar */
      }

      .order-item h5 {
        font-size: 13px; /* Ürün adı yazı boyutu */
        font-weight: 600; /* Kalınlık */
      }

      .order-item p {
        font-size: 12px; /* Fiyat yazı boyutu */
        color: var(--muted); /* Soluk metin rengi */
      }

      .meta-box {
        display: flex; /* Esnek kutu düzeni */
        align-items: center; /* Dikeyde ortalama */
        gap: 10px; /* Rozet ve Sil butonu arası 10px boşluk */
      }

      /* Kategori Rozetleri (Badges) */
      .badge {
        font-size: 11px; /* Küçük metin boyutu */
        padding: 2px 7px; /* Rozet içi padding */
        border-radius: 4px; /* Hafif yuvarlatılmış köşeler */
        font-weight: 600; /* Yarı kalın */
        background: #fef3c7; /* Varsayılan sarımsı arka plan */
        color: #92400e; /* Kahverengi metin */
        font-family: var(--font-mono); /* Monospace font */
      }

      .badge--mobilya {
        background: #e0e7ff; /* Mobilya rozeti açık mavi arka plan */
        color: #3730a3; /* Lacivert metin */
      }

      .badge--aydinlatma {
        background: #fef3c7; /* Aydınlatma rozeti sarı arka plan */
        color: #b45309; /* Turuncu/Kahve metin */
      }

      .badge--seramik {
        background: #d1fae5; /* Seramik / Mutfak yeşil arka plan */
        color: #065f46; /* Yeşil metin */
      }

      /* Silme Butonu */
      .btn-del {
        background: transparent; /* Arka plan şeffaf */
        border: 1px solid var(--border); /* Çerçeve */
        color: var(--muted); /* Gri metin */
        font-size: 11px; /* Küçük font */
        padding: 4px 8px; /* Buton içi boşluk */
        border-radius: 4px; /* Yuvarlatılmış köşe */
        cursor: pointer; /* Tıklanabilir fare imleci */
      }

      .btn-del:hover {
        background: #ef4444; /* Üzerine gelince kırmızı arka plan */
        color: #fff; /* Beyaz yazı */
        border-color: #ef4444; /* Kırmızı çerçeve */
      }
    </style>
  </head>
  <body>
    <!-- Ana Kokpit Kapsayıcısı -->
    <div class="kokpit">

      <!-- Sayfa Üst Bilgisi Header Bölümü Burda Başlıklar bulunur ve main den içeriği ayırır zorunlu değil ama hiyerarşi kurmak ve tarayıcı okuyucuların daha iyi anlaması için önemlidi  -->
      <header class="header">
        <!-- Üst küçük etiket metni -->
        <span class="header__tag"> Sipariş Takip </span>
        <!-- Sayfa Ana Başlığı -->
        <h1 class="header__title">Sipariş Yönetim Kokpiti</h1>
      </header>

      <!-- KPI (Temel Gösterge) İstatistik Kartları Bölümü -->
      <section class="kpi-grid"> <!--Üstteki kartları diğer elementlerden ayırır stilini kpi-grid sınıfından alır ve section semantik yani mantıksal olarak kategorilemede kullanılır-->
        <!-- 1. KPI Kartı: Kayıtlı Sipariş Sayısı -->
        <div class="kpi-card"> <!--kpi-card classı ile alana css stili ekler-->
          <span>Kayıtlı Sipariş</span> <!--İçinde yazan yazıyı diğer bölümlerden ayırır-->
          <!-- JS tarafından dinamik güncellenen toplam sayı -->
          <h3 id="kpiCount">0</h3> <!--benzersi numarası kpiCount-->
        </div>

        <!-- 2. KPI Kartı: Toplam Sipariş Tutarı -->
        <div class="kpi-card"> <!--Stilini kpi-card sınıfından alır-->
          <span>Toplam Sipariş Tutarı: </span><!--İçinde yazan yazıyı diğer bölümlerden ayırır-->
          <!-- JS tarafından dinamik güncellenen toplam tutar -->
          <h3 id="kpiTotal">0 ₺</h3> <!--benzersi numarası kpiTotal-->
        </div>

        <!-- 3. KPI Kartı: Ortalama Ürün Fiyatı -->
        <div class="kpi-card"> <!--Stilini kpi-card sınıfından alır-->
          <span>Ortalama Ürün Fiyatı</span><!--İçinde yazan yazıyı diğer bölümlerden ayırır-->
          <!-- JS tarafından dinamik güncellenen ortalama fiyat -->
          <h3 id="kpiAvg">0 ₺</h3> <!--Başlık etiketi-->
        </div>
      </section>

      <!-- tasarımı layout classından alır Ana İçerik Alanı Bodydeki esas içeriği diğer alanlardan ayırır zorunlu değil ama hiyerarşi kurmak ve tarayıcı okuyucuların daha iyi anlaması için önemlidir-->
      <main class="layout">

        <!-- Sol Panel: Yeni Sipariş Ekleme Formu -->
        <section class="panel"> <!--Üstteki kartları diğer elementlerden ayırır stilini panel sınıfından alır ve section semantik yani mantıksal olarak kategorilemede kullanılır-->
          <h4>Yeni Sipariş Kaydı</h4> <!--Başlık etiketi h4 kalınlığında-->
          <!-- Sipariş ekleme formu -->
          <form id="orderForm"> <!-- Form doldurma alanı-->

            <!-- Ürün Adı Giriş Alanı -->
            <div class="field"> <!-- CSS teki field classı bu alana stil verir -->
              <label for="prodName">Ürün Adı: </label> <!-- Ürün Adı Giriş Alanı -->
              <input type="text" id="prodName" placeholder="Sehpa" required /> <!-- label ve id aynı olmalı çünkü girilen input for aracılığılı ile elemente aktarılı input tipi metin id prodname default yazan değer Sehpa ve required alanın doldurulması gerektiğini söyler--> 
            </div>

            <!-- Kategori Seçim Kutusu stilini field clasından alır label ve id aynı olmalı çünkü girilen input for aracılığılı ile elemente aktarılı arka tarafta select alanda verilen option valueları içinden seçim yapmayı sağlar name ise backend tarafında verinin aktarılmasını sağlar option=value da tarayıcıdaki değerleri gösterir etiketler arasında kalan kısım ise kullanıcını gördüğü formattır. -->
            <div class="field">
              <label for="prodCat">Kategori</label>
              <select name="prodCat" id="prodCat">
                <option value="Mobilya">Mobilya</option>
                <option value="Aydınlatma">Aydınlatma</option>
                <option value="Mutfak">Mutfak</option>
              </select>
            </div>

            <!-- Fiyat Giriş Alanı stilni field classından alır label label id ile aynı olmalı çünkü input alanı ile benzersiz id aracılığı ile bağlantı kurar input türü sayı default value 3250 alabileceği minimum değer 100 ve step: 100 den sonra değer 50şer arttırır required alanın doldurulması gerektiğini söyler.-->
            <div class="field">
              <label for="prodPrice">Fiyat</label>
              <input
                type="number"
                id="prodPrice"
                value="3250"
                min="100"
                step="50"
                required
              />
            </div>

            <!-- Form Gönderme (Kaydet) Butonu input türü submit görünüşünü yani stilini btn-submit sınıfından alır. -->
            <button type="submit" class="btn-submit">Siparişi Kaydet</button>
          </form>
        </section>

        <!-- Sağ Panel: Filtreleme ve Sipariş Listesi -->
        <section class="panel">

          <!-- Arama ve Kategori Filtreleme Çubuğu -->
          <div class="filter-bar"> <!--div alanı diğer taraflardan ayırır ve stilini filter-bar sınıfında alır düzen vermek için kullanılır ama tarayıcı tarafından yok sayılır-->
            <!-- İsimle Arama Kutusu input türü text element idsi searchInput css stilini aldıpı class field alt tarafta dış boşluk 0 ve alanda değer girilmediğinde yazan yazı "Ürün Adına Göre Filtrele"-->
            <input
              type="text"                                     
              id="searchInput"
              class="field"
              style="margin-bottom: 0"
              placeholder="Ürün Adına Göre Filtrele"
            />
            <!-- Kategoriye Göre Filtre Seçimi benzersiz idsi categoryFilter genişliği 130px yazı tipi büyüklüğü 12px ve iç boşluğu 6 px option value tarayıcının front end katmanını okuyacağı veri etiketler arasında kalan bölüm ise kullanacağını göreceği taraf -->
            <select
              id="categoryFilter"
              style="width: 130px; font-size: 12px; padding: 6px"
            >
              <option value="ALL">Tüm Kategoriler</option>
              <option value="Mobilya">Mobilya</option>
              <option value="Aydınlatma">Aydınlatma</option>
              <option value="Mutfak">Mutfak</option>
            </select>
          </div>

          <!-- JavaScript Tarafından Dinamik Olarak Ürün Kartlarının Basılacağı Kapsayıcı -->
          <div id="orderContainer" class="order-list"> <!-- Listenilecek alanları ayırır div etiketi benzersiz numarası orderContainer ve stilini order-list sınıfında alır düzen vermek için kullanılır ama tarayıcı tarafından yok sayılır-->
            <!-- Dinamik olarak elemanlar buraya basılacak/eklenecek -->
          </div>
        </section>
      </main>

      <!-- JavaScript Kod Mantığı -->
      <script>
        // Yeni eklenecek ürünlere atanacak ID değerinin başlangıç sayacı
        let count = 5; 

        // Başlangıçta var olan varsayılan sipariş verileri dizisi
        let orders = [ 
          { id: 1, name: "Sehpa", category: "Mobilya", price: 6500 },
          { id: 2, name: "Abajür", category: "Aydınlatma", price: 7500 },
          { id: 3, name: "Koltuk", category: "Mobilya", price: 8500 },
          { id: 4, name: "Bulaşık Makinası", category: "Mutfak", price: 10000 },
          { id: 5, name: "Ocak", category: "Mutfak", price: 15000 }
        ];

        // HTML (DOM) elemanlarını JavaScript değişkenlerine atama
        const orderContainer = document.getElementById("orderContainer"); //   HtmL de id si order container olan elementi seçer Sipariş kartlarının basılacağı kapsayıcı kutu
        const orderForm = document.getElementById("orderForm"); // HtmL de id si order form olan elementi seçe Yeni sipariş formu
        const searchInput = document.getElementById("searchInput"); // HtmL de id si searchInput olan elementi seçe Arama input kutusu
        const categoryFilter = document.getElementById("categoryFilter"); // HtmL de id si catergoryFilter olan elementi seçe Kategori filtreleme açılır menüsü
        const kpiCount = document.getElementById("kpiCount"); // HtmL de id si kpiCount olan elementi seçe Toplam sipariş sayısı göstergesi
        const kpiTotal = document.getElementById("kpiTotal"); // HtmL de id si kpiTotal olan elementi seçe Toplam tutar göstergesi
        const kpiAvg = document.getElementById("kpiAvg"); // HtmL de id si kpiAvg olan elementi seçe Ortalama fiyat göstergesi

        // KPI istatistik değerlerini (toplam, adet, ortalama) hesaplayıp ekrana yazan fonksiyon
        const updateKPIs = (dataList) => {
          kpiCount.textContent = dataList.length; // Ekrana listedeki ürün sayısını yazar
          
          // Eğer listede hiç ürün yoksa değerleri 0 yap ve fonksiyondan çık
          if (dataList.length === 0) {
            kpiTotal.textContent = "0 ₺";
            kpiAvg.textContent = "0 ₺";
            return;
          }

          // reduce() ile dizideki tüm ürünlerin fiyat toplamını hesaplar
          const total = dataList.reduce((acc, curr) => acc + curr.price, 0);
          kpiTotal.textContent = `${total.toLocaleString("tr-TR")} ₺`; // Türkçe para birimi biçiminde yazar

          // Ortalama ürün fiyatını hesaplar
          const avg = total / dataList.length;
          kpiAvg.textContent = `${Math.round(avg).toLocaleString("tr-TR")} ₺`; // Yuvarlayarak ekrana basar
        };

        // Siparişleri ekrana çizen (render eden) ve filtreleyen ana fonksiyon
        const renderOrders = () => {
          // Arama inputundaki metni küçük harfe çevirip kenar boşluklarını temizler
          const term = searchInput.value.toLowerCase().trim();
          // Seçilen kategoriyi alır
          const selectedCat = categoryFilter.value;

          // Dizideki elemanları arama metni ve seçili kategoriye göre filtreler
          const filtered = orders.filter((order) => {
            const matchesName = order.name.toLowerCase().includes(term); // İsim aranan kelimeyi içeriyor mu?
            const mathesCategory =
              selectedCat === "ALL" || order.category === selectedCat; // Kategori "Tümü" mü veya eşleşiyor mu?
            return matchesName && mathesCategory; // İki şart da sağlanıyorsa listede tut
          });

          // Önceki liste içeriğini temizler
          orderContainer.innerHTML = "";

          // Eğer filtreleme sonucunda ürün bulunamadıysa bilgilendirme mesajı basar ürün bulumadıysa iç boşluğu 24 px yatayda ortalanmış ve root içindeki muted değişkenindeki renk ile 12 px büyüklüğündeki font la uyarı mesajı verir.
          if (filtered.length === 0) {
            orderContainer.innerHTML = `
            <div style="padding:24px; text-align:center; color:var(--muted); font-size:12px"> 
            Kriterlere Uygun Ürün Bulunamadı
            </div>
            `;
            updateKPIs([]); // KPI değerlerini sıfırlar
            return;
          }

          // Filtrelenmiş her ürün için dinamik olarak HTML kartı üretir
          filtered.forEach((order) => {
            const item = document.createElement("article"); // Yeni bir <article> etiketi oluşturur
            item.className = "order-item"; // Sınıf adını ekler
            item.setAttribute("data-id", order.id); // Özel data-id attribute'unu ekler

            // Kategoriye uygun rozet (badge) renk sınıfını seçer
            const badgeClass =
              order.category === "Mobilya"
                ? "badge--mobilya"
                : order.category === "Aydınlatma"
                  ? "badge--aydinlatma"
                  : "badge--seramik";

            // Kartın iç HTML yapısını şablon metin (template literal) ile oluşturur <p> tagı içinde fiyat yazdırır stilinin metabox sınıfından alır onclick türü trigger ile urunSil butonu çalışır.
            item.innerHTML = `
                <div>
                <h5>${order.name}</h5> 
                <p>Birim Fiyat: ${order.price.toLocaleString("tr-TR")} ₺</p>
                </div>
                <div class="meta-box">
                <span class="badge ${badgeClass}">${order.category}</span>
                <button class="btn-del" onclick="urunSil(${order.id})">Sil</button>
                </div>
                `;

            // Oluşturulan ürünü yani kartı sipariş listesi kutusuna ekler
            orderContainer.appendChild(item);
            // KPI istatistiklerini günceller
            updateKPIs(filtered);
          });
        };

        // Form gönderildiğinde yani kaydet butonuna basıldığında çalışacak olay dinleyicisi
        orderForm.addEventListener("submit", (e) => {
          e.preventDefault(); // Sayfanın yeniden yüklenmesini engeller

          // Form alanlarından girilen değerleri alır
          const urunAdi = document.getElementById("prodName").value;
          const urunKategori = document.getElementById("prodCat").value;
          const fiyat = document.getElementById("prodPrice").value;

          count++; // Yeni ID oluşturmak için sayacı 1 artırır

          // Yeni ürün nesnesini dizinin sonuna ekler
          orders.push({
            id: count,
            name: urunAdi,
            category: urunKategori,
            price: Number(fiyat) // Metni sayı veri tipine dönüştürür
          });

          orderForm.reset(); // Form girdilerini temizler
          renderOrders(); // Listeyi ve göstergeleri yeniden ekrana basar
        });

        // Ürün silme fonksiyonu (window nesnesine atanarak inline HTML onclick'inden erişilebilir yapılır)
        window.urunSil = (id) => {
          orders = orders.filter((order) => order.id !== id); // Seçilen ID hariç diğer ürünleri korur 
          renderOrders(); // Listeyi ve göstergeleri günceller
        }; 

        // Arama çubuğuna her harf girildiğinde veya silindiğinde anlık olarak listeyi filtreler
        searchInput.addEventListener("input", renderOrders);

        // Kategori seçimi değiştirildiğinde anlık olarak listeyi filtreler
        categoryFilter.addEventListener("change", renderOrders);

        // Sayfa yüklendiğinde başlangıç verilerini ve KPI göstergelerini ekrana basar
        renderOrders();
      </script>
    </div>
  </body>
</html>
