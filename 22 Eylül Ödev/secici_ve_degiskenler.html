<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3 SEÇİCİ VE DEĞİŞKENLER</title>
</head>
<style>
    :root {
        ---brand-primary: purple;
        --brand-accenct: yellow;
       --bg-surface: white;
       --text-main: black;
       --radius-md: 12px;
    }
    @media(prefers-color-scheme: dark){
        :root{
            --bg-surface:black;
            --text-main:white;
        }
    }
    body{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: aliceblue;
        color: var(--text-main);
        padding: 24px;
    }
    button{
        background-color: aliceblue;
        color:antiquewhite;
        padding: 12px 24px;
        border:none;
        border-radius: var(--radius-md);
        font-size: 10px;
        cursor:pointer;
    }
    .btn-action{
        background-color: var(---brand-primary);

    }
    button.btn-action{
        box-shadow: 0 4px 14px rgba(70,70,229,0.4);
    }
    #submit-btn{
        background: linear-gradient(115dg,var(---brand-primary),var(--brand-accenct));
    }
    .btn-action:hover{
        transform: translateY(-2px);
        filter:brightness(1.1);
    }
    .btn-action:active{
        transform: translateY(0);
    }
</style>
<body>
    <h2>CSS DEĞİŞKENLER</h2>
    <button id="submit-btn" class="btn-action">İşlem Onayla</button>
</body>
</html>
