<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Detay - Mobil E-Ticaret</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

   
    <div class="mobile-wrapper">
        
        
        <header class="sticky-header">
            <button class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
            <h1 class="header-title">Ürün Detayı</h1>
            <button class="icon-btn"><i class="fa-solid fa-heart"></i></button>
        </header>

        <main class="content-area">
            
            
            <div class="product-image-container">
                <span class="badge discount-badge">%20 İndirim</span>
                <span class="badge free-shipping-badge">Kargo Bedava</span>
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=800&auto=format&fit=crop" alt="Kırmızı Spor Ayakkabı">
            </div>

            <div class="product-info">
                <div class="brand">Nike</div>
                <h2 class="product-name">Air Max 270 React - Kırmızı</h2>
                <p class="product-desc">
                    Günlük kullanım için özel olarak tasarlanan hafif, nefes alabilen file üst yüzey ve maksimum yastıklama sunan taban teknolojisi.
                </p>

                <div class="size-section">
                    <h3 class="section-title">Beden / Numara Seç</h3>
                    
                    <div class="chip-list">
                        <div class="chip">38</div>
                        <div class="chip">39</div>
                        <div class="chip active">40</div>
                        <div class="chip">41</div>
                        <div class="chip">42</div>
                        <div class="chip">43</div>
                        <div class="chip">44</div>
                    </div>
                </div>
            </div>

        </main>

        
        <footer class="fixed-bottom-bar">
            <div class="price-container">
                <span class="old-price">2.499 TL</span>
                <span class="current-price">1.999 TL</span>
            </div>
            <button class="add-to-cart-btn">
                <i class="fa-solid fa-cart-shopping"></i> Sepete Ekle
            </button>
        </footer>

    </div>

</body>
</html>
