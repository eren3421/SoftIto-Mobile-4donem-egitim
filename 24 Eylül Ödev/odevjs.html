    <script>

        };
function tahminiFiyat(hedefYuzde, MevcutYuzde, BataryaKiloWatt, istasyonKilowatt, verimlilikKatsayisi, zaman) {
    if (hedefYuzde <= MevcutYuzde){
        return 0;
    }
    const gerekliEnerji = BataryaKiloWatt * ((hedefYuzde - MevcutYuzde) / 100);
    const sebekedenCekilenEnerji = gerekliEnerji / verimlilikKatsayisi;
    let birimFiyat = 0;
    if (zaman >= 6 && zaman < 17) {
        birimFiyat = 3.90;
    } 
    else if (zaman >= 17 && zaman < 22) {
        birimFiyat = 5.50; 
    } 
    else {
        birimFiyat = 1.85;
    }
    const toplamFiyat = sebekedenCekilenEnerji * birimFiyat;
    return toplamFiyat;
}
