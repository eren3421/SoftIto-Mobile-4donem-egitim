<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bas Gaza - Araba Yarışı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Akışkan Başlık -->
        <h1>Bas Gaza</h1>

        <div class="grid">
            
            <div class="card">
                <h2>TEMA🏎️</h2>
                <p>Karanlık asfalt ve neon ışıkların buluştuğu yeraltı yarış dünyası.</p>
                <p>- - -</p>
            </div>

            
            <div class="card">
                <h2>Antrenman🔍</h2>
                <ul>
                    <li>Serbest Sürüş</li>
                    <li>Zamana Karşı</li>
                    <li>Drift Modu</li>
                </ul>
            </div>

            <!-- Kart 3: Kontroller -->
            <div class="card">
                <h2>Kontroller🛞</h2>
                <ul>
                    <li>W, A, S, D - Yön</li>
                    <li>Boşluk - El Freni</li>
                    <li>Shift - Nitro</li>
                </ul>
            </div>

            <div class="card skeleton-card">
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line"></div>
            </div>

        </div>

        <div class="traffic-light-container">
            <div class="traffic-light">
                <div class="light red"></div>
                <div class="light yellow"></div>
                <div class="light green"></div>
            </div>
        </div>
    </div>
</body>
</html>
