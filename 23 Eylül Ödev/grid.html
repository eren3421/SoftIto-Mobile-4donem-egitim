<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID METRİK PANELİ</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #090a0f;
            --card-bg: #200476;
            --border: #262838;
            --text: #430404;
            --text-muted: #a0a5b5;
            --accent: #ff9800;
            --success: #4caf50;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 30px;
            min-height: 100vh;
        }

        h1 {
            margin-top: 24px;
            margin-bottom: 32px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            letter-spacing: -0.5px;
        }

        .metric-grid {
            /* Tek satırda responsive ve ekran büyüdükçe esneyen Grid yapısı */
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease; /* Düzeltildi: 0.2s */
        }

        .metric-card:hover {
            transform: translateY(-4px);
            border-color: #3f435e;
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.5);
        }

        .card-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        
        .card-num {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            margin: 8px 0;
            letter-spacing: -1px;
        }

       
        .card-num-accent {
            color: var(--accent);
        }

        .card-growth {
            font-size: 13px;
            font-weight: 600;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>
    <h1>CSS Metrikleri (auto-fit + minmax)</h1>

    <div class="metric-grid">
        <div class="metric-card">
            <span class="card-label">Anlık Şarj İstasyonu</span>
            <div class="card-num">125 Soket</div>
            <span class="card-growth">%92.4 Aktif</span>
        </div>

        <div class="metric-card">
            <span class="card-label">Bugünkü Tüketim</span>
            <div class="card-num">4.850 kWh</div>
            <span class="card-growth">+%12 dünden fazla</span>
        </div>

        <div class="metric-card">
            <span class="card-label">GİB Eşu Bildirimi</span>
            <!-- Inline style kaldırıldı, sınıf eklendi -->
            <div class="card-num card-num-accent">Hatırlatma: 0 Hata</div>
            <span class="card-growth">Şu anda Xades ve Ves Onaylı</span>
        </div>

        <div class="metric-card">
            <span class="card-label">Ortalama Süre</span>
            <div class="card-num">36.5 Dk</div>
            <span class="card-growth">120kW DC Hızlı Şarj</span>
        </div>
    </div>
</body>
</html>
