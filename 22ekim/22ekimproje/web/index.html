<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mentor_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mentor_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- Native Web Notifications & Chime Support for Mentor App -->
  <script>
    window.MentorNotifications = {
      isSupported: function() {
        return ("Notification" in window);
      },
      getPermission: function() {
        if (!("Notification" in window)) return 'unsupported';
        return Notification.permission;
      },
      requestPermission: async function() {
        if (!("Notification" in window)) return 'unsupported';
        try {
          const perm = await Notification.requestPermission();
          return perm;
        } catch (e) {
          console.error("Error requesting permission:", e);
          return Notification.permission;
        }
      },
      show: function(title, body, iconUrl) {
        if (!("Notification" in window)) return false;
        const icon = iconUrl || 'favicon.png';
        const options = {
          body: body || '',
          icon: icon,
          badge: icon,
          tag: 'mentor-' + Date.now(),
          requireInteraction: true,
          silent: false
        };

        if (Notification.permission === "granted") {
          try {
            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
              navigator.serviceWorker.ready.then(function(reg) {
                if (reg && reg.showNotification) {
                  reg.showNotification(title, options);
                } else {
                  new Notification(title, options);
                }
              }).catch(function() {
                new Notification(title, options);
              });
            } else {
              const n = new Notification(title, options);
              n.onclick = function() {
                window.focus();
                this.close();
              };
            }
            return true;
          } catch (e) {
            console.error("Error displaying notification:", e);
            return false;
          }
        }
        return false;
      }
    };

    window.playNotificationChime = function() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880.00, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.45);
      } catch (e) {}
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.

</body>
</html>
