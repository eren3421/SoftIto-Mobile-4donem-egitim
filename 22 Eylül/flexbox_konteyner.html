<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox Konteyner Laboratuvarı</title>
    <style>
        *,*::before,*::after{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .chip-container{
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }
        .chip{
            background: wheat;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid whitesmoke;
            font-size: 14px;
            font-weight: 500;
            color: #334115;
        }
        .card-header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <h2>Mobil filtre(flex-wrap+gap)</h2>
    <div class="chip-container">
        <div class="chip">Akıllı Telefon</div>
        <div class="chip">Akıllı Kulaklık</div>
        <div class="chip">Akıllı Saat</div>
        <div class="chip">Akıllı Konsol</div>
        <div class="chip">Akıllı Aksesuar</div>
        <div class="chip">Akıllı Bilgisayar</div>
    </div>
    <h2>Navigasyon baru (space-between+align-items)</h2>
    <div class="card-header">
        <div>
            <h3 style="font-size: 16px;">Kullanıcı Profili</h3>
            <p style="color:beige;font-size:13px;">Son Giriş Bugün</p>
        </div>
        <button style="background: darkblue; color: aliceblue; border: none; padding: 8px 14px;border-radius: 8px;">
            Düzenle
        </button>
    </div>
</body>
</html>
