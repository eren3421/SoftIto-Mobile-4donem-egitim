<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil DashBoard</title>
    <style>
        *,*::before,*::after{
            box-sizing: border-box;
            margin:0;
            padding: 0;

        }
        :root{
            --primary:darkblue;
            --primary-dark:dark;
            --accent:green;
            --bg:black;
            --surface:gray;
            --surface-light:white;
            --text: wheat;
            --text-muted: whitesmoke;
        }
        body{
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }
        .phone-container{
            width:100%;
            max-width: 420px;
            background: var(--surface);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--surface-light);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .top-bar{
            position: sticky;
            top:0;
            z-index: 50;
            background: rgba(30,41,50,0.9);
            backdrop-filter: blur(10px);
            display:flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid var(--surface-light);
        }
        .user-profile{
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar{
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            justify-content: center;
            align-items:center;
            font-weight: bold;
        }
        .balance-card{
            margin: 20px;
            padding: 24px;
            background: linear-gradient(135deg,var(--primary),var(--primary-dark));
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap:12;
            box-shadow: 0 10px 25px rgba(67,56,202,0.35);
        }
        .card-chip-badge{
            position:  absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .balance-num{
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .quick-actions{
            display: flex;
            justify-content: space-around;
            padding: 0 20px 20px;
            gap: 8px;
        }
        .action-btn{
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: transparent;
            border:none;
            color:var(--text);
            cursor:pointer;
            font-size: 12px;
        }
        .icon-circle{
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--surface-light);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20;
            transition: all 0.2 ease;
        }
        .action-btn .icon-circle{
            background: var(--primary);
            transform: translateY(-3px);
        }
        .tx-section{
            padding: 0 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .section-title{
            font-size:16px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .tx-item{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
        }
        .tx-left{
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .tx-icon{
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(16,185,129,0.15);
            color: var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }
        .tx-title{
            font-weight: 600;
            font-size: 14px;
        }
        .tx-data{
            font-size: 12px;

            color:var(--text-muted);
        }
        .txt-amount{
            font-weight: 700;
            font-size: 15px;
            color: var(--accent);
        }
        .txt-amount.negative{
            color:red;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!--sticky üst bar-->
        <header class="top-bar">
            <div class="user-profile">
                <div class="avatar">ET</div>
                <div>
                    <p style="font-size: 11px;color:var(--text-muted);">Hoş Geldin,</p>
                    <strong>Eren Türkmen</strong>
                </div>
            </div>
            <button style="background: none;border: none;font-size: 20px;cursor: pointer;">🔔</button>
        </header>
        <section class="balance-card">
            <span class="2card-chip-badge">PLATINUM</span>
            <p style="font-size: 13px; opacity: 0.85;">Toplam Varlıklar</p>
            <div class="balance-num">142.850.00 TL</div>
            <p style="font-size: 12px;opacity: 0.7;">IBAN TR45 54689564</p>
        </section>
        <section class="quick-actions">
            <button class="action-btn">
                <div class="icon-circle">↗️</div>
                <span>Ödemeler</span>
            </button>
            <button class="action-btn">
                <div class="icon-circle">💳</div>
                <span>Transfer</span>
            </button>
            <button class="action-btn">
                <div class="icon-circle">📈</div>
                <span>Yatırım</span>
            </button>
            <button class="action-btn">
                <div class="icon-circle">QR</div>
                <span>KareKod</span>
            </button>
        </section>
        <section class="tx-section">
            <h4 class="section-title">Son Hesap Hareketi</h4>
            <div class="tx-item">
                <div class="tx-left">
                    <div class="tx-icon">💼</div>
                    <div>
                        <div class="tx-title">Eğitim Hakedişi</div>
                        <div class="tx-date">Bugün, 14.30 Havale</div>
                    </div>
                </div>
                <div class="txt-amount">+130.000</div>
            </div>
            <div class="tx-item">
                <div class="tx-left">
                    <div class="tx-icon" style="background-color: rgba(140,255,0,20);color: red">💼</div>
                    <div>
                        <div class="tx-title">Kredi Kapatma</div>
                        <div class="tx-date">20 Eylül, 14.30 Borç</div>
                    </div>
                </div>
                <div class="txt-amount negative">-30.000</div>
            </div>
            <div class="tx-item">
                <div class="tx-left">
                    <div class="tx-icon" style="background-color: rgba(244,63,0,15);color: red">💼</div>
                    <div>
                        <div class="tx-title">Harcama</div>
                        <div class="tx-date">Bugün, 12.30 Nakit</div>
                    </div>
                </div>
                <div class="txt-amount negative">-250</div>
            </div>
        </section>
    </div>
</body>
</html>
