<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,*::before,*,::after{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background: whitesmoke;
            padding: 20px;
        }
        .chat-row{
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            align-items: flex-end;
        }
        .avatar{
            flex-shrink: 0;
            width: 44px;
            border-radius: 50%;
            background: #6366f1;
            color:wheat;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;

        }
        .message-content{
            background: white;
            padding: 12px 16px;
            border-radius: 16px 16px 16px 16px;
            box-shadow: 0 1px 3px rgba(0,0,0,1);
        }
        .chat-row.outgoing{
            flex-direction: row-reverse;

        }
        .chat-row.outgoing .message-content{
            background: #4fff;
            color:white;
            border-radius: 16px 16px 16px 16px
        }
    </style>
</head>
<body>
    <div class="chat-row">
        <div class="avatar">ET</div>
        <div class="message-content">
            <strong>Eren Hoca</strong>
            <p>Merhaba</p>
        </div>
    </div> 
    <div class="chat-row outgoing" >
        <div class="avatar" style="background: green;">ET</div>
        <div class="message-content">
           <p>Sana da Merhaba</p>
        </div>

    </div>
</body>
</html>
