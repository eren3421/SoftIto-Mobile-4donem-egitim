<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline-first Taslak ve Sepet Depolama</title>
    <style>
    body{
        font-family: Arial;
        background: white;
        box-shadow: 0;
        color: yellow;
        padding: 24px;
        max-width: 520px;
        margin: auto;
    }
    .card{
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        border: 1px solid gray;
    }
    .form-group{
        margin-bottom: 16px;
    }
    label{
        display: block;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 6px;
    }
    input, textarea{
        width: 100%;
        padding: 15px;
        border: 1.5px solid white;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
    }
    .badge{
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: bold;
        background: whitesmoke;
        color: blue;
        margin-bottom: 12px;
    }
    .btn-group{
        display: flex;
        gap: 10px;
        margin-top: 16px;
    }
    button{
        flex: 1;
        padding: 10px;
        border-radius: 6px;
        border: none;
        font-weight: bold;
        cursor: pointer;
    }
    .btn-submit{
        background: green;
        color: wheat;
    }
    .btn-clear{
        background: darkred;
        color: whitesmoke;
    }
    .status-msg{
        font-size: 12px;
        color: greenyellow;
        margin-top: 8px;
        font-weight: 600;
        min-height: 18px;
    }
    </style>
</head>
<body>
   <div class="card">
    <span class="badge">Otomatik offline kayıt aktif</span>
    <h3>Arıza Destek</h3>
    <p style="font-size: 12px;color:gray;margin-bottom: 16px;">Tarayıcıyı kapatsan da açık kalır burası</p>
    <form id="supportForm">
        <div class="form-group">
            <label for="txtName">Müşteri Ad Soyad</label>
            <input type="text" id="txtName" name="name" placeholder="Ahmet Yılmaz">
        </div>
        <div class="form-group">
            <label for="txtDevice">Cihaz Modeli</label>
            <input type="text" name="device" id="txtDevice" placeholder="Samsung J2">
        </div>
        <div class="form-group">
            <label for="txtDesc">Arıza Detayı</label>
            <textarea id="txtDesc" name="desc" rows="4" placeholder="Arızayı Detaylandır"></textarea>
        </div>
        <div class="status-msg" id="status-log"></div>
        <div class="btn-group">
            <button type="submit" class="btn-submit">Kaydı Tamamla</button>
            <button type="button" id="btnClear" class="btn-clear">Taslağı Sıfırla</button>
        </div>
    </form>
   </div> 
   <script>
    const storage = 'deneme_amacli123';
    const form = document.getElementById('supportForm');
    const nameInput = document.getElementById('txtName');
    const deviceInput = document.getElementById('txtDevice');
    const descInput = document.getElementById('txtDesc');
    const statusLog = document.getElementById('status-log');
    const btnClear = document.getElementById('btnClear');

    window.addEventListener('DOMContentLoaded', () => {
        const savedData = localStorage.getItem(storage);
        if(savedData){
            try{
                const draft = JSON.parse(savedData);
                nameInput.value = draft.name || "";
                deviceInput.value = draft.device || "";
                descInput.value = draft.desc || "";
                statusLog.innerText = `Önceki Taslak geri yüklendi (${draft.lastSaved})`;
            }
            catch(e){
                console.error("Taslak oluşturma hatası", e);
            }
        }
    });

    form.addEventListener('input', () => {
        const draftData = {
            name: nameInput.value,
            device: deviceInput.value,
            desc: descInput.value,
            lastSaved: new Date().toLocaleTimeString('tr-TR')
        };
        localStorage.setItem(storage, JSON.stringify(draftData));
        statusLog.innerText = `Taslak Onaylandı : ${draftData.lastSaved}`;
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Talep iletildi');
        localStorage.removeItem(storage);
        form.reset();
        statusLog.innerText = 'Form temizlendi';
    });

    btnClear.addEventListener('click', () => {
        if(confirm('Taslağı silmek istediğine emin misin?')){
            localStorage.removeItem(storage);
            form.reset();
            statusLog.innerText = "Form temizlendi";
        }
    });

    window.addEventListener('storage', (event) => {
        if(event.key === storage && event.newValue){
            const remoteDraft = JSON.parse(event.newValue);
            nameInput.value = remoteDraft.name || "";
            deviceInput.value = remoteDraft.device || "";
            descInput.value = remoteDraft.desc || "";
            statusLog.innerText = `Diğer Sekmeden Güncellendi ${remoteDraft.lastSaved}`;
        }
    });
   </script>
</body>
</html>
